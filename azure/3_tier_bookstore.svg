<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="580" viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="900" height="580" fill="#ffffff"/>

<!-- Title -->
<text x="450" y="24" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">Azure 3-Tier IaaS Architecture — Bookstore</text>
<text x="450" y="42" text-anchor="middle" fill="#6b7280" font-size="11">vnet-bookstore-cent-ind-prod-01 · 10.0.0.0/16 · Central India</text>

<!-- Internet -->
<ellipse cx="310" cy="68" rx="90" ry="20" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>
<text x="310" y="73" text-anchor="middle" fill="#4b5563" font-size="12" font-weight="500">Internet (Public)</text>

<!-- Internet to AGW -->
<line x1="310" y1="88" x2="310" y2="120" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

<!-- VNet outer boundary -->
<rect x="10" y="92" width="620" height="465" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="8,5"/>
<text x="22" y="108" fill="#6b7280" font-size="10" font-weight="500">VNet: vnet-bookstore-cent-ind-prod-01 (10.0.0.0/16)</text>

<!-- TIER 1: AGW Subnet -->
<rect x="18" y="112" width="604" height="82" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
<text x="26" y="126" fill="#1e3a8a" font-size="10">snet-agw · 10.0.0.0/24 · nsg-snet-agw-bookstore-cent-ind-prod</text>
<rect x="150" y="132" width="320" height="52" rx="6" fill="#1d4ed8" stroke="#1d4ed8"/>
<text x="310" y="153" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Application Gateway</text>
<text x="310" y="171" text-anchor="middle" fill="#bfdbfe" font-size="11">agw-bookstore · WAF v2 · TLS terminated · 20.207.117.62</text>

<!-- AGW to Web -->
<line x1="310" y1="184" x2="310" y2="210" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<text x="320" y="202" fill="#6b7280" font-size="10">HTTP :80</text>

<!-- TIER 2: Web Subnet -->
<rect x="18" y="210" width="604" height="82" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="0.5"/>
<text x="26" y="224" fill="#14532d" font-size="10">snet-web · 10.0.1.0/24 · nsg-snet-web · NAT Gateway attached</text>
<rect x="100" y="230" width="420" height="52" rx="6" fill="#16a34a" stroke="#16a34a"/>
<text x="310" y="251" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">web-vmss · Nginx</text>
<text x="310" y="269" text-anchor="middle" fill="#bbf7d0" font-size="11">web_vm_image/0.0.1 · 2-4 instances · CPU &gt;70% scale-out · CPU &lt;30% scale-in</text>

<!-- Web to ILB (L-shaped) -->
<path d="M 310 282 L 310 296 L 123 296 L 123 314" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

<!-- TIER 3: App Subnet -->
<rect x="18" y="314" width="604" height="102" rx="5" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.5"/>
<text x="26" y="328" fill="#78350f" font-size="10">snet-app · 10.0.2.0/24 · nsg-snet-app · NAT Gateway attached · AzureLoadBalancer NSG rule required</text>

<!-- ILB box -->
<rect x="26" y="336" width="190" height="70" rx="6" fill="#92400e" stroke="#92400e"/>
<text x="121" y="357" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Internal Load Balancer</text>
<text x="121" y="374" text-anchor="middle" fill="#fde68a" font-size="11">ilb-bookstore · 10.0.2.4</text>
<text x="121" y="392" text-anchor="middle" fill="#fde68a" font-size="10">TCP health probe: :5555</text>

<!-- ILB to App VMSS -->
<line x1="216" y1="371" x2="228" y2="371" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

<!-- App VMSS box -->
<rect x="228" y="336" width="386" height="70" rx="6" fill="#92400e" stroke="#92400e"/>
<text x="421" y="357" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">app-vmss · Node.js :5555</text>
<text x="421" y="374" text-anchor="middle" fill="#fde68a" font-size="11">app_vm_image/0.0.1 · 2-8 instances · CPU &gt;80% → +2 · CPU &lt;40% → -2</text>
<text x="421" y="392" text-anchor="middle" fill="#fde68a" font-size="10">uami-bookstore-cent-ind-prod · Key Vault secret pull at first boot</text>

<!-- App VMSS to CosmosDB (L-shaped) -->
<path d="M 421 406 L 421 422 L 310 422 L 310 436" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<text x="322" y="419" fill="#6b7280" font-size="10">MongoDB API</text>

<!-- TIER 4: DB Subnet -->
<rect x="18" y="436" width="604" height="108" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.5"/>
<text x="26" y="450" fill="#3b0764" font-size="10">snet-db · 10.0.3.0/24 · Private Endpoint only · no public access</text>
<rect x="50" y="458" width="554" height="76" rx="6" fill="#6d28d9" stroke="#6d28d9"/>
<text x="327" y="484" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">CosmosDB — MongoDB API</text>
<text x="327" y="502" text-anchor="middle" fill="#ddd6fe" font-size="11">cosmosdb-bookstore-cent-ind-prod-01 · Private Endpoint NIC: 10.0.3.4</text>
<text x="327" y="520" text-anchor="middle" fill="#c4b5fd" font-size="10">Private DNS Zone: privatelink.mongo.cosmos.azure.com</text>

<!-- ═══ EXTERNAL SERVICES ═══ -->

<!-- Azure Bastion -->
<rect x="648" y="128" width="242" height="56" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="769" y="151" text-anchor="middle" fill="#15803d" font-size="12" font-weight="600">Azure Bastion</text>
<text x="769" y="169" text-anchor="middle" fill="#4b5563" font-size="11">bast-bookstore · SSH · no public IPs</text>
<!-- Bastion to Web (dashed) -->
<path d="M 648 156 L 632 156 L 632 256 L 622 256" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#ad)"/>

<!-- NAT Gateway -->
<rect x="648" y="214" width="242" height="72" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<text x="769" y="237" text-anchor="middle" fill="#78350f" font-size="12" font-weight="600">NAT Gateway</text>
<text x="769" y="254" text-anchor="middle" fill="#4b5563" font-size="11">natgw-bookstore-cent-ind-prod</text>
<text x="769" y="271" text-anchor="middle" fill="#6b7280" font-size="10">Outbound-only internet · Web + App subnets</text>
<!-- NAT GW to Web (dashed, horizontal) -->
<line x1="648" y1="237" x2="622" y2="237" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#ad)"/>
<!-- NAT GW to App (dashed, L-shape) -->
<path d="M 648 265 L 632 265 L 632 365 L 622 365" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#ad)"/>

<!-- Key Vault -->
<rect x="648" y="318" width="242" height="72" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<text x="769" y="341" text-anchor="middle" fill="#78350f" font-size="12" font-weight="600">Key Vault</text>
<text x="769" y="358" text-anchor="middle" fill="#4b5563" font-size="11">kv-bookstore-cent-ind-01</text>
<text x="769" y="375" text-anchor="middle" fill="#6b7280" font-size="10">uami-bookstore-cent-ind-prod</text>
<!-- App VMSS to KV (UAMI, dashed) -->
<path d="M 614 356 L 632 356 L 632 354 L 648 354" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#ad)"/>
<text x="635" y="349" fill="#92400e" font-size="9">UAMI</text>

<!-- Storage Account -->
<rect x="648" y="420" width="242" height="56" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="769" y="443" text-anchor="middle" fill="#15803d" font-size="12" font-weight="600">Storage Account</text>
<text x="769" y="461" text-anchor="middle" fill="#4b5563" font-size="11">stgbookstorecentind · startup scripts</text>
<!-- App VMSS to Storage (UAMI, dashed) -->
<path d="M 614 374 L 632 374 L 632 448 L 648 448" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#ad)"/>

<!-- Legend -->
<rect x="10" y="556" width="880" height="18" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
<text x="18" y="569" fill="#6b7280" font-size="10">&#x25BA; Solid = data plane   &#x25BA; Dashed gray = management/control (Bastion SSH, NAT GW)   &#x25BA; Dashed amber = UAMI identity access   &#x25BA; Zero public IPs on app or DB tier</text>
</svg>
