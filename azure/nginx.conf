# ── UPSTREAM BLOCK ───────────────────────────────────────────────────────────
# This defines a named group of backend servers that Nginx proxies API calls to.
# In your architecture, the only "server" here is the Internal Load Balancer.
# Nginx doesn't talk directly to Node.js instances — it talks to the ILB,
# and the ILB decides which Node.js instance handles each request.
# 10.0.2.4 is the ILB's static private IP you set in Phase 5.
# Port 5555 is the port your Node.js backend listens on.

upstream bookstore_backend {
    server 10.0.2.4:5555;
    
    # Reuse existing TCP connections for API requests.
    # Without keepalive, each API request would create a new TCP connection
    # (a 3-step handshake), adding ~1-3ms of latency per request.
    # With keepalive 32, Nginx maintains up to 32 open connections to the ILB
    # and reuses them for subsequent requests.
    keepalive 32;
}

# ── SERVER BLOCK ─────────────────────────────────────────────────────────────
# Nginx processes every incoming request through the matching server block.
# There is only one server block here because the AGW sends all traffic
# to Nginx on port 80 after terminating TLS.

server {
    # Listen on port 80.
    # The AGW decrypts HTTPS and forwards plain HTTP to us on port 80.
    # Nginx never sees the TLS certificate or the encrypted traffic.
    listen 80;
    
    # Accept requests regardless of the Host header value.
    # Since this VM is behind the AGW and inside the VNet,
    # the host header may be the AGW's public IP, the domain name, or empty.
    # The underscore _ is a catch-all.
    server_name _;
    
    # The folder where Nginx looks for static files.
    # This matches where the startup script extracts frontend-dist.zip.
    root /var/www/bookstore/dist;
    
    # The default file to serve when a directory is requested.
    index index.html;

    # Logs — stored separately from the default Nginx log for easier debugging.
    access_log /var/log/nginx/bookstore-access.log combined;
    error_log  /var/log/nginx/bookstore-error.log warn;

    # ── HEALTH CHECK ENDPOINT ─────────────────────────────────────────────────
    # The Application Gateway (Phase 9) needs to verify that each Nginx instance
    # is alive and responding before sending real traffic to it.
    # It does this by sending GET /health to each Web VMSS instance every 30 seconds.
    # This location block handles those probe requests.
    # It returns HTTP 200 with the text "ok" immediately — no file serving, no proxying.
    # access_log off: don't fill your logs with thousands of health check lines per day.
    
    location /health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # ── API REQUESTS → NODE.JS BACKEND VIA ILB ───────────────────────────────
    # Any request whose path starts with /api/ is an API call from the React app.
    # Nginx does NOT handle these — it passes them to the ILB (10.0.2.4:5555).
    # The ILB then picks a healthy App VMSS instance and forwards the request.
    #
    # Why /api/ with a trailing slash?
    # This matches /api/books, /api/books/123, /api/health — any sub-path.
    # Without the trailing slash (/api), it would only match exactly /api.
    
    location /api/ {
        # proxy_pass sends the request to the upstream group defined above.
        # The full request path is preserved:
        # GET /api/books → forwarded as GET /api/books to Node.js.
        proxy_pass http://bookstore_backend;
        
        # Use HTTP/1.1 for the connection to the backend (required for keepalive).
        # By default, Nginx uses HTTP/1.0 for proxied requests.
        proxy_http_version 1.1;
        
        # Required for HTTP/1.1 keepalive to work.
        # HTTP/1.0 includes "Connection: close" by default.
        # This header clears that and keeps the connection open.
        proxy_set_header Connection "";
        
        # Pass the original requester's IP to Node.js.
        # Without this, your Node.js logs would show every request coming from
        # Nginx's IP instead of the real user's IP.
        # X-Real-IP: the direct client IP (the AGW's IP in this case).
        # X-Forwarded-For: the chain of IPs the request passed through.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Pass the original Host header so Node.js knows which domain was requested.
        proxy_set_header Host $host;
        
        # Tell Node.js the original protocol (https, even though Nginx received http).
        # Useful if Node.js ever needs to build redirect URLs.
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings:
        # proxy_connect_timeout: how long Nginx waits to establish a connection to the ILB.
        # proxy_read_timeout: how long Nginx waits for Node.js to respond after the request is sent.
        # proxy_send_timeout: how long Nginx waits to finish sending the request to Node.js.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        
        # If the ILB returns a connection error, timeout, 502, or 503,
        # Nginx tries the next instance. Since there's only one upstream (the ILB),
        # this mainly handles the case where the ILB itself is briefly unreachable.
        proxy_next_upstream error timeout http_502 http_503;
    }

    # ── STATIC FILES — REACT SPA ──────────────────────────────────────────────
    # This block handles everything that is NOT an /api/ request.
    # It serves your compiled React app files from disk.
    #
    # try_files works in order:
    # 1. $uri        — look for an exact file at this path
    #                  (e.g., /assets/main.css → serves that file from disk)
    # 2. $uri/       — look for a directory at this path
    # 3. /index.html — if neither file nor directory exists, serve index.html
    #                  React Router then reads the URL and shows the right component
    #
    # This is what makes React's client-side routing work.
    # Without fallback to /index.html, refreshing /books would return 404.
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}