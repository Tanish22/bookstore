# UPSTREAM BLOCK
# This defines a pool of backend servers
# Nginx calls this pool "mern_backend"

upstream bookstore_backends {

    # Your two physical backend machines
    # "max_fails=3" means: if Nginx tries this server 3 times and fails each time,
    # stop sending traffic to it for 30 seconds (fail_timeout)

    server 192.168.1.10:5555 max_fails=3 fail_timeout=30s;
    server 192.168.1.25:5555 max_fails=3 fail_timeout=30s;

    # keepalive 32 means: keep 32 idle TCP connections open to backends
    # Without this: Nginx opens a new TCP connection for every single request
    # (a TCP connection requires a 3-way handshake: SYN, SYN-ACK, ACK)
    # With keepalive: existing connections are reused, much faster

    keepalive 32;
}

# SERVER BLOCK 1: Handle HTTP (port 80) and redirect to HTTPS. This block handles requests on port 80 (plain HTTP, unencrypted)

server {
    listen 80;

    # server_name: which hostnames this block responds to    
    server_name 192.168.1.12 bookstore.fe1.local;

    # Redirect every HTTP request to HTTPS
    # 301 = permanent redirect
    # $host = the hostname from the incoming request
    # $request_uri = the URL path and query string

    return 301 https://$host$request_uri;
}

# SERVER BLOCK 2 below : Handle HTTPS (port 443) — the main server block

server {

    # listen 443 ssl: accept connections on port 443 with TLS encryption
    listen 443 ssl;

    # http2 on: enable HTTP/2 for better performance
    # HTTP/2 allows multiple requests over one connection simultaneously
    # http2 on;

    server_name 192.168.1.12 bookstore.fe1.local;

    # TLS certificate files 
    ssl_certificate     /etc/nginx/ssl/bookstore.crt; # actual certificate nginx sends to the client after the initial hanshake

    ssl_certificate_key /etc/nginx/ssl/bookstore.key; # pvt key nginx uses to prove to the client it is legit.

    # Only allow TLS 1.2 and 1.3
    # TLS 1.0 and 1.1 have known security vulnerabilities (POODLE, BEAST)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Which encryption algorithms are allowed
    # ECDHE = Elliptic Curve Diffie-Hellman Ephemeral (key exchange method)
    # AES256-GCM = AES encryption with 256-bit key
    # SHA384 = the hash function used for integrity checking
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Cache TLS session parameters (avoids full handshake on reconnect)
    # shared:SSL:10m = 10MB of shared memory for session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # WHERE TO WRITE LOGS
    # combined format logs: IP, timestamp, method, URL, status, bytes, referrer, user-agent
    access_log /var/log/nginx/bookstore-access.log combined;

    # error_log level "warn" means: only log warnings, errors, and worse
    # "debug" would log everything (too much), "emerg" only critical failures
    error_log /var/log/nginx/bookstore-error.log warn;

    # Where React files are stored on disk
    root  /var/www/bookstore-cors-build/dist;
    index index.html;

    # LOCATION BLOCK: /health
    # This is YOUR health check endpoint for Nginx itself
    # (separate from the Node.js /api/health)
    # Monitoring tools and load balancers call this to check if Nginx is alive
    location /api/health {
        access_log off;       # do not log health checks (they are frequent and noisy)
        return 200 'nginx-ok\n';
        add_header Content-Type text/plain;
    }

    # LOCATION BLOCK: /api/
    # Any URL starting with /api/ gets forwarded to Node.js backends
    location /api {

        # Forward to the upstream pool defined above
        proxy_pass http://bookstore_backends;

        # Use HTTP 1.1 between Nginx and backends (required for keepalive)
        proxy_http_version 1.1;

        # Clear the Connection header from clients
        # Without this, the client's "Connection: close" could reach the backend
        # and close your keepalive connections
        proxy_set_header Connection "";

        # === THE IMPORTANT HEADERS ===

        # X-Real-IP: passes the browser's actual IP address to Node.js
        # Without this: req.ip in Node.js shows Nginx's IP (192.168.1.12)
        # With this: req.headers['x-real-ip'] shows the browser's real IP
        # Used for: access logging, rate limiting, security analysis
        proxy_set_header X-Real-IP $remote_addr;

        # X-Forwarded-For: a chain of all proxies the request passed through
        # Format: "client-ip, proxy1-ip, proxy2-ip"
        # $proxy_add_x_forwarded_for automatically appends the current IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Host: the original hostname the browser used to reach Nginx
        # Without this: backends receive "mern_backend" as the Host header
        # With this: backends receive "192.168.1.12" or "mernapp.local"
        proxy_set_header Host $host;

        # X-Forwarded-Proto: tells backend whether original request was HTTP or HTTPS
        # Your backend can use this to:
        # - Set secure cookies: res.cookie('session', val, { secure: true })
        # - Generate correct redirect URLs
        proxy_set_header X-Forwarded-Proto $scheme;

        # TIMEOUTS
        # connect_timeout: how long to wait for TCP connection to backend
        # On LAN this should be under 1ms, so 5s is very generous
        proxy_connect_timeout 5s;

        # read_timeout: how long to wait for the backend to return a response
        # Increase this if you have slow database queries
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # AUTOMATIC FAILOVER
        # If backend returns these errors, try the other backend automatically
        # Before returning an error to the browser
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        # With 2 backends: try Backend 1, if it fails, try Backend 2
        # Only give up and return 502 if both fail
    }

    # LOCATION BLOCK: /
    # Everything NOT matching /api/ comes here
    # This serves your React application
    location / {
        # try_files checks in order:
        # 1. $uri = does this exact file exist on disk?
        #    Example: /static/js/main.js → yes, it exists → serve it
        # 2. $uri/ = does this directory exist?
        #    Example: /images/ → check if /var/www/mern-frontend/build/images/ exists
        # 3. /index.html = if neither found, serve React's index.html
        #    Example: /dashboard → no file, no directory → serve index.html
        #    React's JavaScript then reads the URL and shows the dashboard page
        try_files $uri $uri/ /index.html;
    }
}
